name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      NOTARIZE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install raylib portmidi

      - name: Build
        run: make compile

      - name: Import signing certificate
        if: env.NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::error::MACOS_CERTIFICATE secret is empty or not set"
            exit 1
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "decoded certificate: $(wc -c < "$RUNNER_TEMP/certificate.p12") bytes, $(file -b "$RUNNER_TEMP/certificate.p12")"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Sign
        if: env.NOTARIZE == 'true'
        run: |
          codesign --force --timestamp --options runtime \
            --entitlements entitlements.plist \
            --sign "Developer ID Application" build/midi
          codesign --verify --strict --verbose=2 build/midi

      - name: Notarize
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/midi build/midi.zip
          xcrun notarytool submit build/midi.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Upload notarized build
        if: env.NOTARIZE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: midi-macos
          path: build/midi.zip

      - name: Remove keychain
        if: always() && env.NOTARIZE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
